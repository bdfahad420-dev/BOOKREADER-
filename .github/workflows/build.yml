name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate Android project
        run: flutter create --project-name pdf_reader_pro --org com.pdfreaderpro --platforms android .

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="PDF Reader Pro"/' android/app/src/main/AndroidManifest.xml

      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/gradle-dist
          key: gradle-dist-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Pre-download Gradle (retries + mirror fallback)
        run: |
          PROPS=android/gradle/wrapper/gradle-wrapper.properties
          URL=$(grep '^distributionUrl=' "$PROPS" | cut -d= -f2- | sed 's#\\:#:#g')
          FILE=$(basename "$URL")
          DEST="$HOME/gradle-dist"
          mkdir -p "$DEST"
          if [ -f "$DEST/$FILE" ] && unzip -tq "$DEST/$FILE" >/dev/null 2>&1; then
            echo "Using cached $FILE"
          else
            rm -f "$DEST/$FILE"
            ok=0
            for src in "$URL" "https://mirrors.cloud.tencent.com/gradle/$FILE" "https://mirrors.aliyun.com/gradle/$FILE"; do
              for i in 1 2 3 4; do
                echo "Downloading $src (try $i)"
                if curl -fL --connect-timeout 30 --max-time 900 -o "$DEST/$FILE" "$src" && unzip -tq "$DEST/$FILE" >/dev/null 2>&1; then
                  ok=1
                  break 2
                fi
                rm -f "$DEST/$FILE"
                sleep $((i * 20))
              done
            done
            if [ "$ok" != 1 ]; then
              echo "Download failed. Falling back to Gradle preinstalled on the runner."
              if command -v gradle >/dev/null 2>&1; then
                gradle --version
                printf '#!/usr/bin/env sh\nexec gradle "$@"\n' > android/gradlew
                chmod +x android/gradlew
                exit 0
              fi
              echo "No preinstalled Gradle found either"
              exit 1
            fi
          fi
          sed -i "s#^distributionUrl=.*#distributionUrl=file://$DEST/$FILE#" "$PROPS"
          grep '^distributionUrl' "$PROPS"

      - name: Gradle network timeouts and memory
        run: |
          mkdir -p "$HOME/.gradle"
          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          systemProp.org.gradle.internal.http.connectionTimeout=180000
          systemProp.org.gradle.internal.http.socketTimeout=180000
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          EOF

      - name: Run flutter pub get
        run: flutter pub get

      - name: Patch compileSdk of all plugins to 36
        run: |
          find "$HOME/.pub-cache/hosted" -path "*/android/build.gradle*" \
            -not -path "*/example/*" -not -path "*/android_test_runner/*" | while read -r f; do
            sed -i -E 's/(compileSdk(Version)?[ =(]+)[0-9]+/\136/' "$f"
            echo "Patched: $f"
          done

      - name: Run flutter build apk --release
        run: |
          for i in 1 2 3 4; do
            echo "Build attempt $i"
            if flutter build apk --release; then
              exit 0
            fi
            echo "Build failed, waiting before retry..."
            sleep $((i * 30))
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
