name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --project-name pdf_reader_pro --org com.pdfreaderpro --platforms android .

      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="PDF Reader Pro"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Patch syncfusion compileSdk
        run: |
          f=$(find "$HOME/.pub-cache/hosted" -path "*/syncfusion_flutter_pdfviewer-*/android/build.gradle" -not -path "*/example/*" | head -n 1)
          echo "Patching $f"
          sed -i -E 's/compileSdkVersion[ =(]+[0-9]+\)?/compileSdkVersion 36/; s/compileSdk[ =(]+[0-9]+\)?/compileSdk 36/' "$f"
          grep -n "compileSdk" "$f" || true

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-apk
          path: build/app/outputs/flutter-apk/app-release.apk
