workflows:
  android-release:
    name: PDF Reader Pro - Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $HOME/.pub-cache
        - $HOME/gradle-dist
    scripts:
      - name: Generate Android project
        script: |
          flutter create --project-name pdf_reader_pro --org com.pdfreaderpro --platforms android .
          sed -i.bak 's/android:label="[^"]*"/android:label="PDF Reader Pro"/' android/app/src/main/AndroidManifest.xml
          rm -f android/app/src/main/AndroidManifest.xml.bak

      - name: Pre-download Gradle (retries + mirror fallback)
        script: |
          PROPS=android/gradle/wrapper/gradle-wrapper.properties
          URL=$(grep '^distributionUrl=' "$PROPS" | cut -d= -f2- | sed 's#\\:#:#g')
          FILE=$(basename "$URL")
          DEST="$HOME/gradle-dist"
          mkdir -p "$DEST"
          if [ -f "$DEST/$FILE" ] && unzip -tq "$DEST/$FILE" >/dev/null 2>&1; then
            echo "Using cached $FILE"
          else
            rm -f "$DEST/$FILE"
            ok=0
            for src in "https://mirrors.cloud.tencent.com/gradle/$FILE" "$URL" "https://mirrors.aliyun.com/gradle/$FILE"; do
              for i in 1 2 3; do
                echo "Downloading $src (try $i)"
                if curl -fL --connect-timeout 30 --max-time 900 -o "$DEST/$FILE" "$src" && unzip -tq "$DEST/$FILE" >/dev/null 2>&1; then
                  ok=1
                  break 2
                fi
                rm -f "$DEST/$FILE"
                sleep $((i * 10))
              done
            done
            if [ "$ok" != 1 ]; then
              echo "Download failed. Trying Gradle installed on this machine."
              if command -v gradle >/dev/null 2>&1; then
                gradle --version
                printf '#!/usr/bin/env sh\nexec gradle "$@"\n' > android/gradlew
                chmod +x android/gradlew
                exit 0
              fi
              echo "No installed Gradle found either"
              exit 1
            fi
          fi
          sed -i.bak "s#^distributionUrl=.*#distributionUrl=file://$DEST/$FILE#" "$PROPS"
          rm -f "$PROPS.bak"
          grep '^distributionUrl' "$PROPS"

      - name: Gradle mirrors, timeouts and memory
        script: |
          mkdir -p "$HOME/.gradle/init.d"
          cat >> "$HOME/.gradle/gradle.properties" <<'EOF'
          systemProp.org.gradle.internal.http.connectionTimeout=180000
          systemProp.org.gradle.internal.http.socketTimeout=180000
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          EOF
          cat > "$HOME/.gradle/init.d/mirrors.gradle" <<'EOF'
          def mirrors = [
            'https://maven-central.storage-download.googleapis.com/maven2/',
            'https://maven.aliyun.com/repository/public',
            'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
          ]
          beforeSettings { settings ->
            settings.pluginManagement.repositories {
              mirrors.each { u -> maven { url = u } }
            }
          }
          allprojects {
            buildscript.repositories {
              mirrors.each { u -> maven { url = u } }
            }
            repositories {
              mirrors.each { u -> maven { url = u } }
            }
          }
          EOF

      - name: Flutter pub get
        script: flutter pub get

      - name: Patch compileSdk of all plugins to 36
        script: |
          find "$HOME/.pub-cache/hosted" -path "*/android/build.gradle*" \
            -not -path "*/example/*" -not -path "*/android_test_runner/*" | while read -r f; do
            perl -pi -e 's/(compileSdk(?:Version)?[ =(]+)\d+/${1}36/' "$f"
            echo "Patched: $f"
          done

      - name: Build APK (with retries)
        script: |
          for i in 1 2 3 4; do
            echo "Build attempt $i"
            if flutter build apk --release; then
              exit 0
            fi
            echo "Build failed, waiting before retry..."
            sleep $((i * 30))
          done
          exit 1

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
